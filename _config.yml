# ============================================================================
#  EIML WORKSHOP SITE — MAIN CONFIG
# ============================================================================
#  To roll the site over to a new year, in most cases you only need to edit
#  the "EDIT EACH YEAR" block below and the files in the _data/ folder.
#  Templates, layouts and styling should not need to change.
# ============================================================================

# ---------------------------------------------------------------------------
#  >>> EDIT EACH YEAR <<<
# ---------------------------------------------------------------------------
workshop:
  edition: "3rd"                      # "1st", "2nd", "3rd", ...
  year: 2026
  short_name: "EIML3@Saarbrücken"          # used in the nav bar / browser title
  full_name: "The 3rd Workshop on Epistemic Intelligence in Machine Learning"
  subtitle: "AI that understands the limits of its knowledge"
  conference: "NeurIPS 2026"
  date: "2–3 December 2026"               # workshop dates, human-readable
  location: "Saarbrücken, Germany"
  venue: "CISPA Helmholtz Center for Information Security"
  venue_url: "https://cispa.de/en"
  contact_email: "pc.eiml.workshop@gmail.com"

  # Logos — put image files in assets/img/logo/ and reference the filename here.
  # Leave a value blank ("") to hide that logo slot.
  logo: "EIML3.png"                            # main workshop logo (header + hero)
  conference_logo: ""                     # independent pre-NeurIPS meeting
  # Partner / sponsor logos (optional) — add as many as you like.
  partner_logos: []
    # - file: "ellis.png"
    #   alt: "ELLIS"
    #   url: "https://ellis.eu"

# Site-wide (rarely changes)
title: "EIML3@Saarbrücken"
description: >-
  How can AI understand and reason about the limits of its own knowledge?
  Join EIML3 at CISPA in Saarbrücken on 2–3 December 2026 for a pre-NeurIPS
  meeting on uncertainty, robustness, generalisation, continual learning,
  and reliable decision-making.

# ---------------------------------------------------------------------------
#  DEPLOYMENT
# ---------------------------------------------------------------------------
#  This organisation Pages repository uses the custom domain in CNAME.
#  It is served from the domain root, so leave baseurl empty.
url: "https://eiml.cc"
baseurl: ""

# ---------------------------------------------------------------------------
#  NAVIGATION  (order = order shown in the menu)
# ---------------------------------------------------------------------------
nav:
  - title: "About"
    url: "/#about"
  - title: "Topics"
    url: "/#topics"
  - title: "Programme"
    url: "/#programme"
  - title: "Organisers"
    url: "/#organisers"
  - title: "Venue"
    url: "/#venue"
  - title: "Past events"
    url: "/archive/"

# ---------------------------------------------------------------------------
#  BUILD SETTINGS  (do not normally need to touch)
# ---------------------------------------------------------------------------
markdown: kramdown
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
