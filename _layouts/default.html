<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {%- if page.archive -%}
      {{ page.title | escape }} · EIML Workshop Series
    {%- elsif page.title and page.title != "Home" -%}
      {{ page.title }} · {{ site.workshop.short_name }}
    {%- else -%}
      {{ site.workshop.short_name }}
    {%- endif -%}
  </title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% unless page.archive %}<link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}">{% endunless %}
</head>
<body{% unless page.archive %} class="current-edition{% if page.landing %} is-landing{% endif %}"{% endunless %}>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include header.html %}
  <main class="container" id="main-content">
{{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
