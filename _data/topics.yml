# Topics of interest, shown on Home and Calls for Papers.
# Each topic has a title and either:
#   description - a paragraph (rendered as prose), and/or
#   points      - a list of sub-bullets (rendered as a bullet list)

- title: "Philosophical foundations of imprecision and uncertainty"
  description: "Reliable AI needs a clear account of what it means to know, to doubt, and to act with incomplete information. We explore how these ideas should shape the way AI systems represent and communicate the limits of their knowledge."
  points:
    - "What does it mean for an AI system to know something or recognise its own ignorance?"
    - "When should uncertainty change a system's beliefs, explanations, or decisions?"

- title: "Mathematical and statistical aspects of imprecision and uncertainty"
  description: "When evidence is limited, a single precise probability may not fully express what is known. We study mathematical representations of incomplete knowledge and statistical methods for learning, prediction, and decisions under uncertainty."
  points:
    - "How can we represent and measure uncertainty without claiming more precision than the evidence supports?"
    - "Which guarantees remain useful when data are scarce, assumptions fail, or conditions change?"

- title: "Applications to modern AI"
  description: "AI systems need to recognise unfamiliar situations and respond appropriately as their environment changes. We connect uncertainty research to robustness, generalisation, continual learning, and reliable decision-making in modern AI."
  points:
    - "How can language models, generative systems, and AI agents recognise and communicate gaps in their knowledge?"
    - "When should a system seek information, revise what it has learned, defer to a person, or decline to act?"
