submission:
- The workshop welcomed original research and work in progress on reasoning and decision-making
  under incomplete knowledge, including theoretical work, applications, benchmarks,
  and foundational perspectives.
- Papers were submitted through OpenReview using the EIML 2026 LaTeX style. The call
  specified 4–6 pages, excluding references and supplementary material, with anonymised
  submissions for double-blind review.
- The workshop was non-archival. Work previously shared in non-archival venues, or
  under review elsewhere, was eligible; authors were asked to check the policies of
  any other venue.
- The call permitted language models as general-purpose writing assistants. It encouraged
  at least one author of each submission to volunteer as a reviewer.
- The event was primarily in person, with authors asked to present posters where possible.
  The accepted-paper page subsequently specified eight-minute oral presentations and
  five-minute spotlights, each accompanied by a poster.
