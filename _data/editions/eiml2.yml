summary: The second EIML workshop brought the series to ICML in Seoul, connecting
  uncertainty research with generative AI, safety, alignment, and continual learning.
overview:
- Reliable learning systems need to recognise when their knowledge is insufficient.
  The second workshop explored this ability, called epistemic intelligence, across
  problems such as distribution shift, hallucination, safety, and alignment.
- Building on the first EIML workshop at EurIPS 2025, the programme connected foundational
  work on uncertainty with practical questions about how models can identify gaps
  in their knowledge, seek information, revise beliefs, and decide when to abstain.
topics:
- title: Foundations of uncertainty
  points:
  - Representing incomplete knowledge through extensions of probability, including
    sets of distributions and higher-order models.
  - Distinguishing randomness, ambiguity, and ignorance, and studying rational learning
    and decisions under incomplete information.
  - Understanding the consequences for generalisation, model comparison, and robustness.
- title: Uncertainty-aware generative AI and foundation models
  points:
  - Recognising uncertainty and mitigating hallucination in generative models.
  - Using uncertainty in decoding, prompting, inference, and reward modelling.
- title: AI safety as an epistemic problem
  points:
  - Reasoning about failures that were not anticipated during development.
  - Identifying gaps in knowledge and supporting abstention, refusal, or safe fallback
    behaviour.
- title: AI alignment under objective uncertainty
  points:
  - Learning when human objectives and preferences are incomplete, changing, or manipulated.
  - Representing uncertainty about values and examining the limits of preference learning.
- title: Lifelong and continual learning in open worlds
  points:
  - Revising beliefs as conditions change and new concepts emerge.
  - Accumulating knowledge while retaining appropriate uncertainty and reducing catastrophic
    forgetting.
