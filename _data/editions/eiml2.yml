archive_notes:
- This record preserves the published website as retrieved on 13 October 2026; affiliations
  reflect that source.
- The Important Dates page updates author notification to 17 May 2026, while the homepage
  still says 15 May. The archive follows the explicit update on the Important Dates
  page and records the discrepancy here.
- The original call mentioned ten-minute spotlights, while the accepted-paper list
  specifies eight-minute oral presentations and five-minute spotlights. The published
  programme is retained as its own record.
- Fazl Barez’s talk title was published, but its abstract was still marked TBD when
  retrieved.
- The programme committee entry “Buelte” is reproduced as listed; the source does
  not provide a given name.
- Some original portraits and the sponsor image could not be retrieved. Names and
  affiliations are preserved, but no sponsor identity has been inferred from an inaccessible
  image.
